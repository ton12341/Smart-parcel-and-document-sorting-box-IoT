  /* ---------- ปุ่มกด (วาดทับให้เหมือนพื้นหลัง เพื่อให้มีแอนิเมชันกด) ---------- */
  .btn {
    position: absolute;
    top: 471px; width: 185px; height: 191px;
    background: #737373;
    border: 4px solid #000;
    cursor: pointer;
    outline: none;
    padding: 0;
  }
  #btn-doc { left: 285px; }
  #btn-parcel { left: 666px; }
  .btn .dot {
    position: absolute;
    left: 50%; top: 50%;
    width: 133px; height: 133px;
    margin: -66.5px 0 0 -66.5px;
    border-radius: 50%;
    border: 3.5px solid #000;
    transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
  }
  #btn-doc .dot { background: #ff3131; }
  #btn-parcel .dot { background: #5170ff; }
  .btn:hover .dot { filter: brightness(1.08); }
  .btn:active .dot, .btn.pressed .dot {
    transform: scale(.9);
    filter: brightness(.85);
    box-shadow: inset 0 6px 12px rgba(0,0,0,.35);
  }
  .btn:focus-visible { box-shadow: 0 0 0 5px rgba(0, 74, 173, .6); }
  /* วงแหวนเรืองแสงเมื่อกำลังทำงาน */
  .btn.active .dot { box-shadow: 0 0 0 8px rgba(255,255,255,.55), 0 0 22px 6px rgba(255,255,255,.7); }

  /* ---------- ข้อความในหน้าจอ (กรอบสีน้ำเงิน) ---------- */
  #screen-text {
    position: absolute;
    left: 1143px; top: 335px; width: 442px; height: 93px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    color: #000; font-weight: 700;
    white-space: nowrap;
    pointer-events: none;
  }
  #screen-text .l1 { font-size: 44px; line-height: 1.25; }
  #screen-text .l2 { font-size: 30px; line-height: 1.2; margin-top: -2px; font-variant-numeric: tabular-nums; }
  #screen-text .l1.pop { animation: pop .35s ease; }
  @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  #measure { position: absolute; visibility: hidden; white-space: nowrap; font-weight: 700; font-size: 100px; left: 0; top: 0; }

  /* ---------- ช่องเอกสาร (สี่เหลี่ยมยาวใต้จอ) ---------- */
  #slot-doc {
    position: absolute;
    left: 995px; top: 507px; width: 723px; height: 113px;
    background: #000;
    perspective: 2200px;
  }
  /* ช่องเอกสาร: บานพับอยู่ด้านบน ฝาเปิดขึ้นข้างบนและยื่นออกมาด้านนอก */
  #door-doc {
    position: absolute; inset: 0;
    background: #da8c2d;
    border: 4px solid #000;
    transform-origin: top center;
    transition: transform .9s cubic-bezier(.65, 0, .35, 1);
    backface-visibility: hidden;
  }
  #slot-doc.open #door-doc { transform: rotateX(82deg); }   /* บานพับบน: ขอบล่างของฝาสวิงออกมาหาผู้ดู */

  /* ---------- ช่องพัสดุ (กล่องใหญ่) ---------- */
  #slot-parcel {
    position: absolute;
    left: 1087px; top: 653px; width: 565px; height: 281px;
    background: #000;
    perspective: 2200px;
  }
  #door-parcel {
    position: absolute; inset: 0;
    background: #da8c2d;
    border: 4px solid #000;
    transform-origin: bottom center;   /* ช่องพัสดุ: บานพับอยู่ด้านล่าง ฝาเปิดลงล่างและยื่นออกมาด้านนอก */
    transition: transform 1s cubic-bezier(.65, 0, .35, 1);
    backface-visibility: hidden;
  }
  #door-parcel .handle {
    position: absolute;
    left: 197px; top: 25px;     /* 1288-1087-4 , 682-653-4 */
    width: 164px; height: 49px;
    background: #282a29;
    border: 4px solid #000;
  }
  #slot-parcel.open #door-parcel { transform: rotateX(-82deg); }   /* บานพับล่าง: ขอบบนของฝาสวิงออกมาหาผู้ดู */
</style>
</head>
<body>

<div id="stage">
  <!-- ช่องเอกสาร -->
  <div id="slot-doc"><div id="door-doc"></div></div>
  <!-- ช่องพัสดุ -->
  <div id="slot-parcel"><div id="door-parcel"><div class="handle"></div></div></div>

  <!-- ข้อความบนหน้าจอ -->
  <div id="screen-text" aria-live="polite"></div>
  <span id="measure"></span>

  <!-- ปุ่มกด -->
  <button class="btn" id="btn-doc" aria-label="เอกสาร"><span class="dot"></span></button>
  <button class="btn" id="btn-parcel" aria-label="พัสดุ"><span class="dot"></span></button>
</div>

<script>
(function () {
  /* ---------- 1) ปรับเวทีให้เต็มจอ ---------- */
  const stage = document.getElementById('stage');
  function fit() {
    const s = Math.max(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ---------- 2) ปรับขนาดอักษรให้ "ช่องใส่เอกสารเปิด" กว้าง 331px เท่าในรูปต้นแบบ ---------- */
  const screenEl = document.getElementById('screen-text');
  const measure = document.getElementById('measure');
  function fitFont() {
    measure.style.fontFamily = getComputedStyle(stage).fontFamily;
    measure.textContent = 'ช่องใส่เอกสารเปิด';
    const w = measure.getBoundingClientRect().width / fitScale();
    if (w > 0) {
      const size = 100 * 331 / w;
      l1El.style.fontSize = size.toFixed(2) + 'px';
      l2El.style.fontSize = (size * 0.68).toFixed(2) + 'px';
    }
  }
  function fitScale() { return stage.getBoundingClientRect().width / 1920; }

  /* ---------- 3) สถานะระบบ ---------- */
  const btnDoc = document.getElementById('btn-doc');
  const btnParcel = document.getElementById('btn-parcel');
  const slotDoc = document.getElementById('slot-doc');
  const slotParcel = document.getElementById('slot-parcel');

  let docOpen = false, docLeft = 0, docTimer = null, docClear = null;
  let parcelState = null;          // null | 'open' | 'locked'
  let owner = null;                // ใครเป็นเจ้าของข้อความบนจอ: 'doc' | 'parcel' | null
  let lastKey = '';

  const l1El = document.createElement('div'); l1El.className = 'l1';
  const l2El = document.createElement('div'); l2El.className = 'l2';
  l1El.addEventListener('animationend', function () { l1El.classList.remove('pop'); });
  screenEl.appendChild(l1El); screenEl.appendChild(l2El);

  function render() {
    let l1 = '', l2 = '';
    if (owner === 'doc') {
      l1 = 'ช่องใส่เอกสารเปิด';
      l2 = 'จะปิดใน ' + docLeft + ' วินาที';
    } else if (owner === 'parcel') {
      l1 = parcelState === 'open' ? 'ปลดล็อคกลอนแล้ว' : 'ล็อคกลอน';
    } else if (owner === 'ready') {
      l1 = 'ระบบพร้อมทำงาน';
    }
    const changed = l1El.textContent !== l1;
    l1El.textContent = l1;
    l2El.textContent = l2;
    l2El.style.display = l2 ? '' : 'none';
    if (changed && l1) {
      l1El.classList.remove('pop'); void l1El.offsetWidth; l1El.classList.add('pop');
    }
  }

  function pressFx(btn) {
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 160);
  }

  /* ---------- 4) ปุ่มเอกสาร (สีแดง) ---------- */
  function closeDoc() {
    clearInterval(docTimer); docTimer = null;
    docOpen = false;
    slotDoc.classList.remove('open');
    btnDoc.classList.remove('active');
    docLeft = 0; render();
    clearTimeout(docClear);
    docClear = setTimeout(function () {
      if (owner === 'doc') owner = (parcelState === 'open') ? 'parcel' : 'ready';
      render();
    }, 1000);
  }
  btnDoc.addEventListener('click', function () {
    pressFx(btnDoc);
    clearTimeout(docClear);
    owner = 'doc';
    docLeft = 10;
    slotDoc.classList.add('open');
    btnDoc.classList.add('active');
    docOpen = true;
    render();
    clearInterval(docTimer);
    docTimer = setInterval(function () {
      docLeft -= 1;
      if (docLeft <= 0) { closeDoc(); return; }
      render();
    }, 1000);
  });

  /* ---------- 5) ปุ่มพัสดุ (สีน้ำเงิน): กดเปิด / กดอีกครั้งเพื่อปิด ---------- */
  let lockTimer = null;
  btnParcel.addEventListener('click', function () {
    pressFx(btnParcel);
    clearTimeout(lockTimer);
    if (parcelState === 'open') {
      parcelState = 'locked';
      slotParcel.classList.remove('open');
      btnParcel.classList.remove('active');
      owner = 'parcel';                       // แสดง "ล็อคกลอน" ระหว่างฝากำลังปิด
      render();
      lockTimer = setTimeout(function () {    // จบกระบวนการ -> ระบบพร้อมทำงาน
        if (parcelState !== 'locked') return;
        parcelState = null;
        if (owner === 'parcel') owner = docOpen ? 'doc' : 'ready';
        render();
      }, 2000);
    } else {
      parcelState = 'open';
      slotParcel.classList.add('open');
      btnParcel.classList.add('active');
      owner = 'parcel';
      render();
    }
  });

  /* ---------- เริ่มต้น ---------- */
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () {
    fitFont(); render();
  });
  fitFont(); render();
})();
</script>
</body>
</html>
